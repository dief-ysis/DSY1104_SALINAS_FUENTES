<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerto Hogar</title>
    <!-- HH-002: Importar fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap&text=ABCDEFGHIJKLMNÑOPQRSTUVWXYZabcdefghijklmnñopqrstuvwxyz0123456789" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">
                <img src="/assets/images/logo.png" alt="Huerto Hogar Logo"> <!-- Asegúrate de tener el logo en esta ubicación -->
            </a>
            <button class="navbar-toggle" aria-label="Menú">
                <span class="hamburger"></span>
            </button>
            <div class="navbar-menu">
                <a href="index.html" class="nav-link active">HOME</a>
                <a href="productos.html" class="nav-link">Productos</a>
                <a href="blog.html" class="nav-link">Blog</a>
                <a href="contacto.html" class="nav-link">Contacto</a>
                <div class="cart-container">
                    <button class="cart-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span class="cart-badge">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section HH-011 -->
    <section class="hero"> <!-- HH-011 -->
        <div class="hero-container"> <!-- HH-011 -->
            <div class="hero-content"> <!-- HH-011 -->
                <h1 class="hero-title">Frescura y naturalidad</h1> <!-- HH-011 -->
                <p class="hero-subtitle">Productos orgánicos directo a tu hogar</p> <!-- HH-011 -->
                <a href="productos.html" class="cta-button" role="button">Ver catálogo</a> <!-- HH-011 -->
            </div>
        </div>
    </section>

    <!-- Categorías destacadas HH-012 -->
    <section class="categories-grid"> <!-- HH-012 -->
        <h2 class="categories-title">Categorías destacadas</h2> <!-- HH-012 -->
        <div class="categories-tiles"> <!-- HH-012 -->
            <a href="productos.html?cat=frutas" class="category-tile" tabindex="0" aria-label="Frutas Frescas" style="background-image:url('img/manzana.jpg')"> <!-- HH-012 -->
                <span class="category-label">Frutas Frescas</span> <!-- HH-012 -->
            </a>
            <a href="productos.html?cat=verduras" class="category-tile" tabindex="0" aria-label="Verduras Orgánicas" style="background-image:url('img/zanahoria.jpg')"> <!-- HH-012 -->
                <span class="category-label">Verduras Orgánicas</span> <!-- HH-012 -->
            </a>
            <a href="productos.html?cat=organicos" class="category-tile" tabindex="0" aria-label="Productos Orgánicos" style="background-image:url('img/miel.jpg')"> <!-- HH-012 -->
                <span class="category-label">Productos Orgánicos</span> <!-- HH-012 -->
            </a>
            <a href="productos.html?cat=lacteos" class="category-tile" tabindex="0" aria-label="Lácteos" style="background-image:url('img/TEMAS_lacteos_interna_horiz_840x410.jpg')"> <!-- HH-012 -->
                <span class="category-label">Lácteos</span> <!-- HH-012 -->
            </a>
        </div>
    </section>

    <!-- Productos destacados HH-013 -->
    <section class="featured-products"> <!-- HH-013 -->
        <h2 class="featured-title">Productos destacados</h2> <!-- HH-013 -->
        <div class="products-grid" id="featured-products-grid"> <!-- HH-013 -->
            <!-- Cards de productos destacados se renderizan aquí --> <!-- HH-013 -->
        </div>
    </section>

    <script src="productos_huerto.js"></script>
    <script src="categorias_huerto.js"></script>
    <script>
    // Renderizar productos destacados HH-013
    import { PRODUCTS_HH } from './productos_huerto.js'; // HH-013

    function formatCLP(value) { // HH-013
        return value.toLocaleString('es-CL', { style: 'currency', currency: 'CLP', minimumFractionDigits: 0 });
    }

    function renderFeaturedProducts() { // HH-013
        const grid = document.getElementById('featured-products-grid');
        if (!grid) return;
        // Selecciona los primeros 6 productos válidos
        const destacados = PRODUCTS_HH.slice(0, 6);
        grid.innerHTML = destacados.map(producto => `
            <div class="product-card" tabindex="0"> <!-- HH-013 -->
                <img src="${producto.imagen.replace('assets/products/', 'img/')}" alt="${producto.nombre}" class="product-image" /> <!-- HH-013 -->
                <div class="product-name">${producto.nombre}</div> <!-- HH-013 -->
                <div class="product-price">${formatCLP(producto.precioCLP)} / ${producto.unidad}</div> <!-- HH-013 -->
                <div class="product-actions"> <!-- HH-013 -->
                    <button class="add-to-cart-btn" aria-label="Añadir ${producto.nombre} al carrito">Añadir</button> <!-- HH-013 -->
                    <a href="detalle.html?code=${producto.code}" class="details-btn" aria-label="Ver detalle de ${producto.nombre}">Detalle</a> <!-- HH-013 -->
                </div>
            </div>
        `).join('');
    }

    document.addEventListener('DOMContentLoaded', function() {
        // ...existing code...
        renderFeaturedProducts(); // HH-013
    });
    </script>
    <script>
        // Función para actualizar el contador del carrito
        function actualizarContadorCarrito() {
            const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            const contador = carrito.reduce((total, item) => total + item.cantidad, 0);
            document.querySelector('.cart-badge').textContent = contador;
        }

        // Manejar el toggle del menú móvil
        document.querySelector('.navbar-toggle').addEventListener('click', function() {
            document.querySelector('.navbar-menu').classList.toggle('active');
            this.classList.toggle('active');
        });

        // Marcar el enlace activo
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link');
            
            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath.split('/').pop()) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });

            // Actualizar contador del carrito al cargar la página
            actualizarContadorCarrito();
        });
    </script>
</body>
</html>
