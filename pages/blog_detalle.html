<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - HuertoHogar</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- [MEJORA] Header replicado según solicitud -->
  <header>
    <div class="container topbar" role="navigation" aria-label="Principal">
      <a class="brand" href="../index.html" aria-label="Ir al inicio Huerto Hogar">
        <img src="../img/logo.jpg" alt="Logo Huerto Hogar" class="logo-img">
        <span class="title">Huerto Hogar</span>
      </a>
      <label for="nav-toggle" class="burger" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
      </label>
      <input type="checkbox" id="nav-toggle" aria-hidden="true">
      <nav>
        <ul>
          <li><a href="../index.html#home" aria-current="page">Inicio</a></li>
          <li><a href="../index.html#productos">Productos</a></li>
          <li><a href="../index.html#categorias">Categorías</a></li>
          <li><a href="../index.html#blog">Blog</a></li>
          <li><a href="../index.html#contacto">Contacto</a></li>
        </ul>
      </nav>
      <a class="cart" href="../index.html#carrito" aria-label="Ir al carrito">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 7h14l-1.5 9h-11zM7 7l-2-4H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span>Carrito</span>
        <span class="badge" aria-live="polite" aria-atomic="true">0</span>
      </a>
    </div>
  </header>
<section class="blog_detail">
  <div class="container">
    <article class="blog-article">
      <div class="breadcrumb">
        <a href="index.html">Inicio</a> > 
        <a href="blogs.html">Blog</a> > 
        <span id="breadcrumb-title"></span>
      </div>
      
      <header class="blog-header">
        <h1 id="blog-title"></h1>
        <div class="blog-meta">
          <span id="blog-date"></span>
          <span>Por <span id="blog-author"></span></span>
        </div>
        <img id="blog-image" src="" alt="" class="blog-main-image">
      </header>
      
      <div class="blog-content" id="blog-content">
        <!-- El contenido del blog se cargará dinámicamente -->
      </div>
      
      <footer class="blog-footer">
        <div class="blog-tags">
          <span>Etiquetas:</span>
          <span class="tag">Alimentación Saludable</span>
          <span class="tag">Productos Orgánicos</span>
        </div>
        
        <div class="blog-share">
          <span>Compartir:</span>
          <div class="share-buttons">
            <button class="share-btn" data-platform="facebook">Facebook</button>
            <button class="share-btn" data-platform="twitter">Twitter</button>
            <button class="share-btn" data-platform="whatsapp">WhatsApp</button>
          </div>
        </div>
      </footer>
    </article>
    
    <aside class="blog-sidebar">
      <div class="sidebar-section">
        <h3>Artículos Relacionados</h3>
        <div class="related-posts" id="related-posts">
          <!-- Posts relacionados se cargarán dinámicamente -->
        </div>
      </div>
      
      <div class="sidebar-section">
        <h3>Newsletter</h3>
        <p>Suscríbete para recibir recetas y tips de alimentación saludable</p>
        <form class="newsletter-form">
          <input type="email" placeholder="Tu correo electrónico" required>
          <button type="submit" class="btn btn-primary">Suscribirse</button>
        </form>
      </div>
    </aside>
  </div>
</section>
</body>
</html>
