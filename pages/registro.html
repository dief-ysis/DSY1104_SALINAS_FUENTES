<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - HuertoHogar</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- [MEJORA] Header replicado según solicitud -->
  <header>
    <div class="container topbar" role="navigation" aria-label="Principal">
      <a class="brand" href="../index.html" aria-label="Ir al inicio Huerto Hogar">
        <img src="../img/logo.jpg" alt="Logo Huerto Hogar" class="logo-img">
        <span class="title">Huerto Hogar</span>
      </a>
      <label for="nav-toggle" class="burger" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
      </label>
      <input type="checkbox" id="nav-toggle" aria-hidden="true">
      <nav>
        <ul>
          <li><a href="../index.html#home" aria-current="page">Inicio</a></li>
          <li><a href="../index.html#productos">Productos</a></li>
          <li><a href="../index.html#categorias">Categorías</a></li>
          <li><a href="../index.html#blog">Blog</a></li>
          <li><a href="../index.html#contacto">Contacto</a></li>
        </ul>
      </nav>
      <a class="cart" href="../index.html#carrito" aria-label="Ir al carrito">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 7h14l-1.5 9h-11zM7 7l-2-4H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span>Carrito</span>
        <span class="badge" aria-live="polite" aria-atomic="true">0</span>
      </a>
    </div>
  </header>
<section class="auth-form">
  <div class="container">
    <div class="form-container">
      <h1>Crear Cuenta</h1>
      
      <form id="register-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="run">RUN</label>
            <input type="text" id="run" name="run" required placeholder="12345678-9">
            <div class="error-message" id="run-error"></div>
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="nombre">Nombres</label>
            <input type="text" id="nombre" name="nombre" required maxlength="100">
            <div class="error-message" id="nombre-error"></div>
          </div>
          
          <div class="form-group">
            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" name="apellidos" required maxlength="100">
            <div class="error-message" id="apellidos-error"></div>
          </div>
        </div>
        
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" required maxlength="100">
          <div class="error-message" id="email-error"></div>
        </div>
        
        <div class="form-group">
          <label for="fecha-nacimiento">Fecha de Nacimiento (Opcional)</label>
          <input type="date" id="fecha-nacimiento" name="fechaNacimiento">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="region">Región</label>
            <select id="region" name="region" required>
              <option value="">Selecciona una región</option>
              <!-- Las regiones se cargarán dinámicamente -->
            </select>
            <div class="error-message" id="region-error"></div>
          </div>
          
          <div class="form-group">
            <label for="comuna">Comuna</label>
            <select id="comuna" name="comuna" required disabled>
              <option value="">Selecciona una comuna</option>
            </select>
            <div class="error-message" id="comuna-error"></div>
          </div>
        </div>
        
        <div class="form-group">
          <label for="direccion">Dirección</label>
          <input type="text" id="direccion" name="direccion" required maxlength="300">
          <div class="error-message" id="direccion-error"></div>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required minlength="4" maxlength="10">
          <div class="error-message" id="password-error"></div>
        </div>
        
        <div class="form-group">
          <label for="confirm-password">Confirmar Contraseña</label>
          <input type="password" id="confirm-password" name="confirmPassword" required>
          <div class="error-message" id="confirm-password-error"></div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-full">Crear Cuenta</button>
      </form>
      
      <div class="form-footer">
        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
      </div>
    </div>
  </div>
</section>
</body>
</html>
