<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto - Huerto Hogar</title>
    <link rel="stylesheet" href="../css/style.css">
    <meta name="description" content="Huerto Hogar - Detalle de producto">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="blogs.html">Blog</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="detalle-container"></div>
    </main>

    <footer>
        <p>&copy; 2024 Huerto Hogar. Todos los derechos reservados.</p>
    </footer>

    <script type="module">
        import { PRODUCTS_HH, categoriaNombre, formatCLP } from '../js/productos_huerto.js';

        // Obtener el código del producto de la URL
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');

        // Encontrar el producto
        const producto = PRODUCTS_HH.find(p => p.code === code);
        const stockCritico = 10;
        const container = document.getElementById('detalle-container');

        if (!producto) {
            container.innerHTML = '<div class="error-message">Producto no encontrado</div>';
        } else {
            container.innerHTML = `
            <div class="producto-detalle">
                <div class="producto-imagen">
                    <img src="../${producto.imagen}" alt="${producto.nombre}" class="main-image" />
                    <span class="category-badge badge-${producto.categoriaId}">${categoriaNombre(producto.categoriaId)}</span>
                </div>
                
                <div class="producto-info">
                    <h1 class="producto-titulo">${producto.nombre}</h1>
                    <div class="producto-precio">
                        <span class="precio-actual">${formatCLP(producto.precioCLP)}</span>
                        <span class="unidad">/ ${producto.unidad}</span>
                    </div>
                    
                    <div class="producto-meta">
                        <div class="meta-item">
                            <span class="meta-label">Código:</span>
                            <span class="meta-value">${producto.code}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Origen:</span>
                            <span class="meta-value">${producto.origen || 'Local'}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Stock:</span>
                            <span class="meta-value ${producto.stock < stockCritico ? 'stock-bajo' : ''}">${producto.stock} unidades</span>
                        </div>
                    </div>

                    <div class="producto-descripcion">
                        <h2>Descripción</h2>
                        <p>${producto.descripcion}</p>
                    </div>

                    ${producto.practicas ? `
                    <div class="producto-practicas">
                        <h2>Prácticas sostenibles</h2>
                        <ul>
                            ${producto.practicas.map(practica => `<li>${practica}</li>`).join('')}
                        </ul>
                    </div>
                    ` : ''}

                    ${producto.recetas && producto.recetas.length > 0 ? `
                    <div class="producto-recetas">
                        <h2>Recetas sugeridas</h2>
                        <ul>
                            ${producto.recetas.map(receta => `
                                <li>
                                    <a href="${receta}" target="_blank" rel="noopener noreferrer" class="receta-link">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                                            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                                            <line x1="6" y1="1" x2="6" y2="4"></line>
                                            <line x1="10" y1="1" x2="10" y2="4"></line>
                                            <line x1="14" y1="1" x2="14" y2="4"></line>
                                        </svg>
                                        Ver receta
                                    </a>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                    ` : ''}

                    <div class="producto-compra">
                        <div class="cantidad-selector">
                            <label for="cantidad-input">Cantidad:</label>
                            <div class="cantidad-controls">
                                <button class="cantidad-btn" onclick="this.nextElementSibling.stepDown(); this.nextElementSibling.dispatchEvent(new Event('change'))">-</button>
                                <input type="number" id="cantidad-input" min="1" max="${producto.stock}" value="1" ${producto.stock === 0 ? 'disabled' : ''}>
                                <button class="cantidad-btn" onclick="this.previousElementSibling.stepUp(); this.previousElementSibling.dispatchEvent(new Event('change'))">+</button>
                            </div>
                            <div id="cantidad-feedback" class="feedback-message"></div>
                        </div>
                        
                        ${producto.stock === 0 ? 
                            '<div class="stock-agotado">Producto agotado</div>' : 
                            `<button class="add-to-cart" onclick="agregarAlCarrito('${producto.code}', document.getElementById('cantidad-input').value)">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"></path>
                                    <path d="M20 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"></path>
                                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                                </svg>
                                Añadir al carrito
                            </button>`
                        }
                        <div id="cart-message" class="cart-message"></div>
                    </div>
                </div>
            </div>`;

            // Función para validar cantidad
            function validarCantidad(input) {
                const cantidad = parseInt(input.value);
                const max = parseInt(input.max);
                const feedbackEl = document.getElementById('cantidad-feedback');
                
                if (isNaN(cantidad) || cantidad < 1) {
                    feedbackEl.textContent = 'La cantidad debe ser al menos 1';
                    feedbackEl.className = 'feedback-message error';
                    return false;
                }
                
                if (cantidad > max) {
                    feedbackEl.textContent = `Solo hay ${max} unidades disponibles`;
                    feedbackEl.className = 'feedback-message error';
                    input.value = max;
                    return false;
                }
                
                feedbackEl.textContent = '';
                feedbackEl.className = 'feedback-message';
                return true;
            }

            // Agregar event listener después de crear el elemento
            const cantidadInput = document.getElementById('cantidad-input');
            if (cantidadInput) {
                cantidadInput.addEventListener('change', function() {
                    validarCantidad(this);
                });
            }
        }

        // Función para agregar al carrito
        window.agregarAlCarrito = function(code, cantidad) {
            const producto = PRODUCTS_HH.find(p => p.code === code);
            if (!producto) return;
            
            const input = document.getElementById('cantidad-input');
            if (!validarCantidad(input)) return;
            
            cantidad = parseInt(cantidad);
            const messageEl = document.getElementById('cart-message');

            // Obtener el carrito actual del localStorage
            let carrito = JSON.parse(localStorage.getItem('carrito') || '[]');
            
            // Buscar si el producto ya está en el carrito
            const index = carrito.findIndex(item => item.code === code);
            
            if (index !== -1) {
                // Actualizar cantidad si el producto ya está en el carrito
                const nuevaCantidad = carrito[index].cantidad + cantidad;
                if (nuevaCantidad > producto.stock) {
                    messageEl.textContent = `No se pueden agregar más unidades. Ya tienes ${carrito[index].cantidad} en el carrito`;
                    messageEl.className = 'cart-message error';
                    return;
                }
                carrito[index].cantidad = nuevaCantidad;
            } else {
                // Agregar nuevo producto al carrito
                carrito.push({
                    code: code,
                    cantidad: cantidad,
                    nombre: producto.nombre,
                    precio: producto.precioCLP,
                    imagen: producto.imagen
                });
            }
            
            // Guardar el carrito actualizado
            localStorage.setItem('carrito', JSON.stringify(carrito));
            
            // Mostrar mensaje de confirmación
            messageEl.textContent = 'Producto agregado al carrito';
            messageEl.className = 'cart-message success';
            
            // Limpiar el mensaje después de 3 segundos
            setTimeout(() => {
                messageEl.textContent = '';
                messageEl.className = 'cart-message';
            }, 3000);
        };
    </script>
</body>
</html>
