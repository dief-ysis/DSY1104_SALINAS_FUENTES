<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="Navegación principal">
      <div class="navbar-container">
        <a href="index.html" class="navbar-logo">
          <img src="../assets/images/logo.png" alt="Logo de Huerto Hogar, tienda de productos orgánicos">
        </a>
        <button class="navbar-toggle" aria-label="Menú">
          <span class="hamburger"></span>
        </button>
        <div class="navbar-menu">
          <a href="index.html" class="nav-link active">Home</a>
          <a href="pages/productos.html" class="nav-link">Productos</a>
          <a href="pages/blogs.html" class="nav-link">Blog</a>
          <a href="pages/contacto.html" class="nav-link">Contacto</a>
          <div class="cart-container">
            <button class="cart-button">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
              </svg>
              <span class="cart-badge">0</span>
            </button>
          </div>
        </div>
      </div>
    </nav>
        <!-- CATÁLOGO MODERNO DE PRODUCTOS -->
        <main class="catalogo-container" style="max-width:1200px;margin:2.5rem auto 2rem auto;padding:0 1.5rem;">
            <!-- Barra de filtros por categoría -->
            <section class="filter-bar" style="background:#f8fafb;border-radius:16px;padding:1.1rem 1.5rem 0.7rem 1.5rem;box-shadow:0 2px 8px rgba(46,139,87,0.08);margin-bottom:1.2rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;">
                <div class="filter-tabs" style="display:flex;gap:0.7rem;">
                    <button class="filter-tab" data-cat="FR" style="background:#fff;color:#2E8B57;border:1.5px solid #2E8B57;border-radius:999px;padding:0.5em 1.3em;font-weight:600;transition:background 0.2s,color 0.2s,box-shadow 0.2s;">Frutas</button>
                    <button class="filter-tab" data-cat="VR" style="background:#fff;color:#2E8B57;border:1.5px solid #2E8B57;border-radius:999px;padding:0.5em 1.3em;font-weight:600;transition:background 0.2s,color 0.2s,box-shadow 0.2s;">Verduras</button>
                    <button class="filter-tab" data-cat="PO" style="background:#fff;color:#2E8B57;border:1.5px solid #2E8B57;border-radius:999px;padding:0.5em 1.3em;font-weight:600;transition:background 0.2s,color 0.2s,box-shadow 0.2s;">Orgánicos</button>
                    <button class="filter-tab" data-cat="PL" style="background:#fff;color:#2E8B57;border:1.5px solid #2E8B57;border-radius:999px;padding:0.5em 1.3em;font-weight:600;transition:background 0.2s,color 0.2s,box-shadow 0.2s;">Lácteos</button>
                </div>
                <button class="clear-filters-btn" style="background:#ffd700;color:#1e6a45;border:none;border-radius:8px;padding:0.5em 1.2em;font-weight:600;box-shadow:0 2px 8px rgba(46,139,87,0.08);transition:background 0.2s,color 0.2s;">Quitar filtros</button>
            </section>

            <!-- Búsqueda y ordenamiento -->
            <section class="search-sort-bar" style="display:flex;flex-wrap:wrap;align-items:center;gap:1.2rem 2.5rem;margin-bottom:1.5rem;justify-content:space-between;">
                <input type="text" id="search-input" placeholder="Buscar por nombre o código..." autocomplete="off" style="flex:1 1 260px;max-width:340px;padding:0.7em 1.1em;border-radius:8px;border:1.5px solid #e0e7ef;font-size:1.05rem;box-shadow:0 1px 4px rgba(46,139,87,0.06);" />
                <div class="sort-buttons" style="display:flex;gap:0.7rem;">
                    <button id="sort-asc" aria-label="Ordenar por precio ascendente" style="background:#fff;color:#2E8B57;border:1.5px solid #2E8B57;border-radius:8px;padding:0.5em 1.2em;font-weight:600;transition:background 0.2s,color 0.2s;">Precio ↑</button>
                    <button id="sort-desc" aria-label="Ordenar por precio descendente" style="background:#fff;color:#2E8B57;border:1.5px solid #2E8B57;border-radius:8px;padding:0.5em 1.2em;font-weight:600;transition:background 0.2s,color 0.2s;">Precio ↓</button>
                </div>
            </section>

            <!-- Listado de productos -->
            <section class="products-list" style="background:#fff;border-radius:18px;box-shadow:0 4px 18px rgba(46,139,87,0.10);padding:2.2rem 1.2rem 1.5rem 1.2rem;">
                <div id="products-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:2rem 1.5rem;"></div>
                <button id="ver-mas-btn" style="display:none;margin:2rem auto 0 auto;min-width:180px;background:#2E8B57;color:#fff;border:none;border-radius:8px;padding:0.7em 1.5em;font-weight:600;box-shadow:0 2px 8px rgba(46,139,87,0.10);transition:background 0.2s;" aria-label="Ver más productos">Ver más</button>
            </section>
        </main>

    <script type="module">
    import { PRODUCTS_VALIDOS } from '../js/productos_huerto.js'; // HH-021

    // Utilidad para formatear CLP HH-021
    function formatCLP(value) {
        return value.toLocaleString('es-CL', { 
            style: 'currency', 
            currency: 'CLP', 
            minimumFractionDigits: 0 });
    }

    // Normalizar texto (acentos y mayúsculas) HH-022
    function normalizeText(text) { // HH-022
        return text.normalize('NFD')
        .replace(/[00-6f]/g, '')
        .toLowerCase();
    }

    // Estado de filtro, búsqueda y paginación HH-023
    let filtroCategoria = null;
    let searchTerm = '';
    let sortOrder = null; // 'asc' | 'desc'
    let paginaActual = 1; // HH-023
    const productosPorPagina = 12; // HH-023

    // Renderizar productos filtrados, ordenados y paginados HH-023
    function renderProducts(productos) {
        const grid = document.getElementById('products-grid');
        const verMasBtn = document.getElementById('ver-mas-btn');
        // Paginación HH-023
        const inicio = 0;
        const fin = paginaActual * productosPorPagina;
        const productosPagina = productos.slice(0, fin);

        grid.innerHTML = productosPagina.map((producto, idx) => `
            <div class="product-card" tabindex="0" id="prod-${paginaActual}-${idx}"> 
                <div class="card-image-container"> 
                    <img src="../${producto.imagen}" alt="Imagen de ${producto.nombre}, ${producto.descripcion}" class="product-image" /> 
                    <span class="category-badge badge-${producto.categoriaId}">${categoriaNombre(producto.categoriaId)}</span> 
                </div>
                <div class="product-name">${producto.nombre}</div>
                <div class="product-desc" style="color:#4b5563;font-size:0.98rem;margin-bottom:0.3rem;min-height:2.2em;">${producto.descripcion}</div>
                <div class="product-price">${formatCLP(producto.precioCLP)} / ${producto.unidad}</div> 
                <div class="product-actions"> 
                    <button class="add-to-cart-btn" aria-label="Añadir ${producto.nombre} al carrito">Añadir</button>
                    <a href="detalle.html?code=${producto.code}" class="details-btn">Detalle</a> 
                </div>
            </div>
        `).join('');
        // Mostrar/ocultar botón HH-023
        if (productos.length > productosPagina.length) {
            verMasBtn.style.display = '';
        } else {
            verMasBtn.style.display = 'none';
        }
        // Evento añadir al carrito y feedback HH-024
        grid.querySelectorAll('.add-to-cart-btn').forEach((btn, i) => {
            btn.addEventListener('click', function() {
                const prod = productosPagina[i];
                let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
                const idx = carrito.findIndex(item => item.code === prod.code);
                if (idx >= 0) {
                    carrito[idx].cantidad += 1;
                } else {
                    carrito.push({ code: prod.code, cantidad: 1 });
                }
                localStorage.setItem('carrito', JSON.stringify(carrito));
                mostrarFeedback(btn, 'Añadido');
                actualizarContadorCarrito();
            });
        });
    }

    // Helper para nombre de categoría HH-024
    function categoriaNombre(catId) {
        switch(catId) {
            case 'FR': return 'Frutas';
            case 'VR': return 'Verduras';
            case 'PO': return 'Orgánicos';
            case 'PL': return 'Lácteos';
            default: return 'Otro';
        }
    }

    // Feedback visual HH-024
    function mostrarFeedback(btn, texto) {
        btn.disabled = true;
        const original = btn.textContent;
        btn.textContent = texto;
        btn.classList.add('added');
        setTimeout(() => {
            btn.textContent = original;
            btn.classList.remove('added');
            btn.disabled = false;
        }, 900);
    }

    // Actualizar contador carrito HH-024
    function actualizarContadorCarrito() {
        const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        const contador = carrito.reduce((total, item) => total + item.cantidad, 0);
        const badge = document.querySelector('.cart-badge');
        if (badge) badge.textContent = contador;
    }

    // Lógica de filtro, búsqueda, orden y paginación HH-023
    function aplicarFiltroBusquedaOrden() {
        let productosFiltrados = filtroCategoria ? PRODUCTS_VALIDOS.filter(p => p.categoriaId === filtroCategoria) : PRODUCTS_VALIDOS;
        if (searchTerm) {
            const term = normalizeText(searchTerm);
            productosFiltrados = productosFiltrados.filter(p =>
                normalizeText(p.nombre).includes(term) || normalizeText(p.code).includes(term)
            );
        }
        if (sortOrder) {
            productosFiltrados = [...productosFiltrados].sort((a, b) => {
                if (sortOrder === 'asc') return a.precioCLP - b.precioCLP;
                else return b.precioCLP - a.precioCLP;
            });
        }
        renderProducts(productosFiltrados);
    }

    // Botón Ver más HH-023
    document.getElementById('ver-mas-btn').addEventListener('click', function() {
        paginaActual++;
        aplicarFiltroBusquedaOrden();
        // Focus en el primer producto del nuevo bloque HH-023
        setTimeout(() => {
            const grid = document.getElementById('products-grid');
            const primerNuevo = grid.querySelector(`#prod-${paginaActual}-${(paginaActual-1)*productosPorPagina}`);
            if (primerNuevo) primerNuevo.focus();
        }, 100);
    });

    // Eventos UI HH-021 y HH-022
    document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            filtroCategoria = this.dataset.cat;
            paginaActual = 1; // HH-023
            aplicarFiltroBusquedaOrden();
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
        });
    });
    document.querySelector('.clear-filters-btn').addEventListener('click', function() {
        filtroCategoria = null;
        paginaActual = 1; // HH-023
        aplicarFiltroBusquedaOrden();
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    });

    // Debounce búsqueda HH-022
    let debounceTimeout;
    document.getElementById('search-input').addEventListener('input', function() {
        clearTimeout(debounceTimeout);
        const value = this.value;
        debounceTimeout = setTimeout(() => {
            searchTerm = value;
            paginaActual = 1; // HH-023
            aplicarFiltroBusquedaOrden();
        }, 250);
    });

    // Ordenamiento HH-022
    document.getElementById('sort-asc').addEventListener('click', function() {
        sortOrder = 'asc';
        paginaActual = 1; // HH-023
        aplicarFiltroBusquedaOrden();
    });
    document.getElementById('sort-desc').addEventListener('click', function() {
        sortOrder = 'desc';
        paginaActual = 1; // HH-023
        aplicarFiltroBusquedaOrden();
    });

    // Inicializar listado HH-021/HH-022/HH-023
    aplicarFiltroBusquedaOrden();
    </script>
</body>
</html>
