<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#F7F7F7"/>
  
  <!-- Organic Products Category -->
  <circle cx="100" cy="120" r="60" fill="#8B4513" opacity="0.1"/>
  
  <!-- Jar/Container -->
  <rect x="75" y="90" width="50" height="60" rx="3" fill="#D2B48C" stroke="#8B4513" stroke-width="2"/>
  <rect x="85" y="80" width="30" height="15" fill="#A0826D" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Honey inside jar -->
  <path d="M 80 130 L 120 130 Q 120 140 100 145 Q 80 140 80 130" fill="#FFD700" opacity="0.8"/>
  
  <!-- Bee -->
  <circle cx="110" cy="70" r="5" fill="#FFD700"/>
  <ellipse cx="110" cy="65" rx="3" ry="4" fill="#000"/>
  <path d="M 108 68 L 105 75" stroke="#FFD700" stroke-width="1"/>
  <path d="M 112 68 L 115 75" stroke="#FFD700" stroke-width="1"/>
  
  <!-- Text -->
  <text x="100" y="200" font-family="Montserrat, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#8B4513">PRODUCTOS ORGÁNICOS</text>
</svg>