<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <defs>
    <linearGradient id="contactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#contactGrad)"/>
  
  <!-- Contact icons -->
  <!-- Email icon -->
  <rect x="30" y="40" width="80" height="60" rx="5" fill="#2E8B57" opacity="0.2"/>
  <path d="M 40 60 L 70 75 L 100 60" stroke="#2E8B57" stroke-width="2" fill="none"/>
  <rect x="40" y="60" width="60" height="30" fill="none" stroke="#2E8B57" stroke-width="2"/>
  
  <!-- Phone icon -->
  <rect x="160" y="40" width="80" height="60" rx="5" fill="#2E8B57" opacity="0.2"/>
  <rect x="175" y="55" width="50" height="35" rx="3" fill="none" stroke="#2E8B57" stroke-width="2"/>
  <circle cx="200" cy="90" r="3" fill="#2E8B57"/>
  
  <!-- Location icon -->
  <rect x="290" y="40" width="80" height="60" rx="5" fill="#2E8B57" opacity="0.2"/>
  <path d="M 330 55 C 325 50 318 50 318 57 C 318 62 330 75 330 75 C 330 75 342 62 342 57 C 342 50 335 50 330 55" fill="#2E8B57"/>
  <circle cx="330" cy="58" r="2" fill="#FFF"/>
  
  <!-- Contact info -->
  <text x="200" y="140" font-family="Montserrat, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2E8B57">Contáctanos</text>
  <text x="200" y="165" font-family="Montserrat, sans-serif" font-size="12" text-anchor="middle" fill="#666">info@huerthogar.cl</text>
  <text x="200" y="185" font-family="Montserrat, sans-serif" font-size="12" text-anchor="middle" fill="#666">+56 9 1234 5678</text>
  <text x="200" y="205" font-family="Montserrat, sans-serif" font-size="12" text-anchor="middle" fill="#666">Chillan, Ñuble</text>
  <text x="200" y="230" font-family="Montserrat, sans-serif" font-size="11" text-anchor="middle" fill="#999">Lun - Vie: 09:00 - 18:00</text>
  <text x="200" y="245" font-family="Montserrat, sans-serif" font-size="11" text-anchor="middle" fill="#999">Sab - Dom: Cerrado</text>
</svg>