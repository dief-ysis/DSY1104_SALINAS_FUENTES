<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#F7F7F7"/>
  
  <!-- Success icon background -->
  <circle cx="200" cy="120" r="60" fill="#2E8B57" opacity="0.1"/>
  <circle cx="200" cy="120" r="50" fill="#2E8B57" opacity="0.2"/>
  
  <!-- Checkmark -->
  <path d="M 170 120 L 190 140 L 240 90" stroke="#2E8B57" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Success message -->
  <text x="200" y="200" font-family="Montserrat, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2E8B57">¡Compra Exitosa!</text>
  <text x="200" y="230" font-family="Montserrat, sans-serif" font-size="14" text-anchor="middle" fill="#666">Tu pedido ha sido procesado</text>
  <text x="200" y="250" font-family="Montserrat, sans-serif" font-size="14" text-anchor="middle" fill="#666">correctamente</text>
  
  <!-- Order number -->
  <rect x="100" y="260" width="200" height="30" rx="5" fill="#E8F5E9" stroke="#2E8B57" stroke-width="1"/>
  <text x="200" y="280" font-family="Montserrat, sans-serif" font-size="12" text-anchor="middle" fill="#2E8B57">Orden: HH-2024101501</text>
</svg>